name: build

on:
  push:
  pull_request:

jobs:
  test-and-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    # iOS can only be built on macOS. This produces an unsigned build to
    # prove the project compiles; signing and App Store upload need an
    # Apple developer account and certificates added as secrets.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build ios --release --no-codesign

  ios-simulator:
    # Runs the app on the iOS Simulator and uploads a screenshot of every
    # screen (integration_test/screenshots_test.dart). Without a Mac this is
    # the only way to see the iOS build, and the pictures double as App Store
    # screenshots (a 6.9" iPhone and a 13" iPad are what App Store Connect
    # asks for).
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: iPhone 17 Pro Max
            kind: iphone
          - device: iPad Pro 13-inch
            kind: ipad
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Boot a simulator
        id: sim
        env:
          WANTED: ${{ matrix.device }}
          KIND: ${{ matrix.kind }}
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, os, sys
          devices = json.load(sys.stdin)['devices']
          prefix = 'iPad' if os.environ['KIND'] == 'ipad' else 'iPhone'
          found = [d for runtime, ds in devices.items() if 'iOS' in runtime
                   for d in ds if d['name'].startswith(prefix)]
          found.sort(key=lambda d: d['name'])
          wanted = [d for d in found if d['name'].startswith(os.environ['WANTED'])]
          chosen = (wanted or found)[-1]
          print(chosen['name'], file=sys.stderr)
          print(chosen['udid'])")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - run: >
          flutter drive
          --driver=test_driver/integration_test.dart
          --target=integration_test/screenshots_test.dart
          -d ${{ steps.sim.outputs.udid }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots-${{ matrix.kind }}
          path: screenshots/
